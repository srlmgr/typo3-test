# Dev overrides: mounts local files and runs Apache as your host user
# so you can edit files without sudo.
services:
  typo3:
    volumes:
      - ./typo3.conf:/etc/apache2/sites-available/000-default.conf:ro
      - .:/var/www/html
    environment:
      APACHE_RUN_USER: "#${HOST_UID:-1000}"
      APACHE_RUN_GROUP: "#${HOST_GID:-1000}"
