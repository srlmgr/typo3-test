services:
  typo3:
    build:
      context: .
      dockerfile: Dockerfile
    image: t3test
    restart: unless-stopped
    ports:
      - "${TYPO3_PORT:-8380}:80"
    networks:
      - appnet
    environment:
      TYPO3_CONTEXT: Production
      TYPO3_DB_DRIVER: mysqli
      TYPO3_DB_HOST: mariadb
      TYPO3_DB_PORT: 3306
      TYPO3_DB_NAME: ${DB_NAME:-typo3}
      TYPO3_DB_USERNAME: ${DB_USER:-typo3}
      TYPO3_DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      TYPO3_ENCRYPTION_KEY: ${TYPO3_ENCRYPTION_KEY:?TYPO3_ENCRYPTION_KEY is required}
      TYPO3_SITE_URL: ${TYPO3_SITE_URL:?TYPO3_SITE_URL is required}
    volumes:
      - typo3-fileadmin:/var/www/html/public/fileadmin
      - typo3-uploads:/var/www/html/public/uploads
      - typo3-temp:/var/www/html/public/typo3temp
      - typo3-system:/var/www/html/config/system
    depends_on:
      mariadb:
        condition: service_healthy

  typo3-init:
    image: t3test
    profiles:
      - tools
    networks:
      - appnet
    environment:
      TYPO3_CONTEXT: Production
      TYPO3_DB_DRIVER: mysqli
      TYPO3_DB_HOST: mariadb
      TYPO3_DB_PORT: 3306
      TYPO3_DB_NAME: ${DB_NAME:-typo3}
      TYPO3_DB_USERNAME: ${DB_USER:-typo3}
      TYPO3_DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      TYPO3_ENCRYPTION_KEY: ${TYPO3_ENCRYPTION_KEY:?TYPO3_ENCRYPTION_KEY is required}
      TYPO3_SETUP_ADMIN_USERNAME: ${ADMIN_USER:-admin}
      TYPO3_SETUP_ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
      TYPO3_SETUP_ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      TYPO3_SITE_URL: ${TYPO3_SITE_URL:-http://localhost:8380/}
      TYPO3_PROJECT_NAME: ${TYPO3_PROJECT_NAME:-my_project}
    volumes:
      - typo3-fileadmin:/var/www/html/public/fileadmin
      - typo3-uploads:/var/www/html/public/uploads
      - typo3-temp:/var/www/html/public/typo3temp
      - typo3-system:/var/www/html/config/system
    entrypoint: ["/usr/local/bin/docker-init-typo3.sh"]
    depends_on:
      mariadb:
        condition: service_healthy

  mariadb:
    image: mariadb:11.8
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME:-typo3}
      MARIADB_USER: ${DB_USER:-typo3}
      MARIADB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is required}
    volumes:
      - mariadb-data:/var/lib/mysql
    networks:
      - appnet
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mariadb-data:
  typo3-system:
  typo3-fileadmin:
  typo3-uploads:
  typo3-temp:

networks:
  appnet:
    driver: bridge
