# Resolved at runtime from the container environment, so one image can serve any URL.
base: '%env(TYPO3_SITE_URL)%'
dependencies:
  - typo3/fluid-styled-content
  - typo3/fluid-styled-content-css
  - myvendor/site-package

languages:
  - title: English
    enabled: true
    languageId: 0
    base: /
    locale: en_US.UTF-8
    navigationTitle: English
    flag: us
rootPageId: 1
