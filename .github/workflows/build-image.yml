name: Build image

on:
  workflow_dispatch:
  push:
    tags:
      - v*.*.*

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      # id-token: write
      # attestations: write

    steps:
      - name: Detect prerelease tag
        id: release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$TAG_NAME" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+-.+$ ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Docker meta for stable release
        id: meta_stable
        if: steps.release.outputs.is_prerelease != 'true'
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: |
            ghcr.io/${{ github.repository }}
          tags: |
            type=schedule
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha

      - name: Docker meta for prerelease
        id: meta_prerelease
        if: steps.release.outputs.is_prerelease == 'true'
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: |
            ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=sha

      - name: setup qemu for docker
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4
      - name: Setup docker buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Login to Github Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.release.outputs.is_prerelease == 'true' && steps.meta_prerelease.outputs.tags || steps.meta_stable.outputs.tags }}
          labels: ${{ steps.release.outputs.is_prerelease == 'true' && steps.meta_prerelease.outputs.labels || steps.meta_stable.outputs.labels }}

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
          IS_PRERELEASE: ${{ steps.release.outputs.is_prerelease }}
        run: |
          prerelease_arg=()
          edit_prerelease_arg=()
          if [[ "$IS_PRERELEASE" == "true" ]]; then
            prerelease_arg+=(--prerelease)
            edit_prerelease_arg+=(--prerelease)
          else
            edit_prerelease_arg+=(--prerelease=false)
          fi

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release edit "$TAG_NAME" \
              --title "$TAG_NAME" \
              "${edit_prerelease_arg[@]}"
          else
            gh release create "$TAG_NAME" \
              --verify-tag \
              --title "$TAG_NAME" \
              --generate-notes \
              "${prerelease_arg[@]}"
          fi
